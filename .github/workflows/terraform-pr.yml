name: Terraform PR

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "modules/**"
      - "lambdas/**"
      - "scripts/**"
      - "python_layer/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: fmt / validate / plan
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init
        id: init
        run: terraform init -input=false

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -out=tfplan.binary > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          head -c 60000 plan.txt > plan.trimmed.txt
          {
            echo 'PLAN<<EOF'
            cat plan.trimmed.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.PLAN }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const body = `### Terraform PR Checks

            | Step | Result |
            | --- | --- |
            | fmt | \`${process.env.FMT_OUTCOME}\` |
            | validate | \`${process.env.VALIDATE_OUTCOME}\` |
            | plan exit | \`${process.env.PLAN_EXIT}\` |

            <details><summary>Plan output (first 60KB)</summary>

            \`\`\`
            ${process.env.PLAN}
            \`\`\`

            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('### Terraform PR Checks'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if fmt or validate failed
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.plan.outputs.exitcode != '0'
        run: |
          echo "fmt=${{ steps.fmt.outcome }} validate=${{ steps.validate.outcome }} plan_exit=${{ steps.plan.outputs.exitcode }}"
          exit 1
