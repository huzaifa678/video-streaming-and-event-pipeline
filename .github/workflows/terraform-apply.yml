name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "modules/**"
      - "lambdas/**"
      - "scripts/**"
      - "python_layer/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: us-east-1
  PROJECT_NAME: video-analytics

concurrency:
  group: terraform-apply-main
  cancel-in-progress: false

jobs:
  apply:
    name: terraform apply
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

      - name: Restart Rekognition stream processor
        env:
          STREAM_PROCESSOR: ${{ env.PROJECT_NAME }}-video-processor
        run: |
          set -euo pipefail

          echo "Resolving stream processor: $STREAM_PROCESSOR"

          status() {
            aws rekognition describe-stream-processor \
              --name "$STREAM_PROCESSOR" \
              --region "$AWS_REGION" \
              --query 'Status' --output text 2>/dev/null || echo "UNKNOWN"
          }

          wait_for() {
            local target="$1"
            local timeout="${2:-180}"
            local elapsed=0
            while [ "$elapsed" -lt "$timeout" ]; do
              s="$(status)"
              echo "  status=$s (waiting for $target, ${elapsed}s/${timeout}s)"
              if [ "$s" = "$target" ]; then
                return 0
              fi
              if [ "$s" = "FAILED" ] && [ "$target" != "FAILED" ]; then
                echo "  stream processor entered FAILED state"
                return 0
              fi
              sleep 10
              elapsed=$((elapsed + 10))
            done
            echo "::error::timed out waiting for status=$target"
            return 1
          }

          # Initial state: Rekognition stream processors are created STOPPED.
          # On first start they reliably error on the first record, so do
          # start -> wait -> stop -> start to clear the bad initial state.
          initial="$(status)"
          echo "Initial status: $initial"

          if [ "$initial" = "RUNNING" ]; then
            echo "Stopping (currently RUNNING)..."
            aws rekognition stop-stream-processor --name "$STREAM_PROCESSOR" --region "$AWS_REGION"
            wait_for STOPPED 120
          fi

          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "=== Attempt $attempt: start ==="
            aws rekognition start-stream-processor --name "$STREAM_PROCESSOR" --region "$AWS_REGION" || true
            sleep 15
            s="$(status)"
            echo "Post-start status: $s"

            if [ "$s" = "RUNNING" ]; then
              echo "Stream processor RUNNING."
              break
            fi

            echo "Not RUNNING — stopping to retry..."
            aws rekognition stop-stream-processor --name "$STREAM_PROCESSOR" --region "$AWS_REGION" || true
            wait_for STOPPED 120 || true
            attempt=$((attempt + 1))
          done

          final="$(status)"
          if [ "$final" != "RUNNING" ]; then
            echo "::error::stream processor did not reach RUNNING after $max_attempts attempts (final=$final)"
            exit 1
          fi

      - name: Terraform outputs
        run: terraform output -no-color
